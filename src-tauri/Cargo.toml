[package]
name = "network-refresh-architecture-cockpit"
version = "0.1.0"
description = "Local network architecture workspace"
authors = ["Network Refresh Architecture Cockpit"]
edition = "2021"

[workspace]
members = ["storage"]

[lib]
name = "network_refresh_architecture_cockpit"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cockpit-storage = { path = "storage" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
