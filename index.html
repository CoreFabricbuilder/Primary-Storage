<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Network Refresh Architecture Cockpit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">N<span>◆</span></div><div><strong>NETWORK REFRESH</strong><small>ARCHITECTURE COCKPIT</small></div></div>
      <div class="workspace-tag"><small>LOCAL WORKSPACE</small><strong id="workspace-name">Opening…</strong><span id="demo-tag" class="demo-tag" hidden>SYNTHETIC DEMO</span></div>
      <p class="nav-label">ARCHITECTURE</p>
      <nav id="nav" aria-label="Architecture screens">
        <button class="nav-item active" type="button" data-screen="overview"><span>◫</span> Architecture Overview</button>
        <button class="nav-item" type="button" data-screen="topology"><span>◇</span> Topology</button>
        <button class="nav-item" type="button" data-screen="readiness"><span>▤</span> LLD Readiness</button>
        <button class="nav-item" type="button" data-screen="decisions"><span>◈</span> Architecture Decisions</button>
        <button class="nav-item" type="button" data-screen="dependencies"><span>⤳</span> Dependencies</button>
        <button class="nav-item" type="button" data-screen="branches"><span>⌂</span> Branches</button>
      </nav>
      <div class="sidebar-bottom"><p>Design intent · evidence · validation</p><small>Stored in this browser profile</small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="state-switch" id="state-switch" role="group" aria-label="Architecture state">
          <button type="button" data-state="Current" aria-pressed="true">Current</button>
          <button type="button" data-state="Transition" aria-pressed="false">Transition</button>
          <button type="button" data-state="Future" aria-pressed="false">Future</button>
        </div>
        <div class="top-actions">
          <span id="save-status" class="save-status" role="status">Opening local data…</span>
          <button id="import-button" class="button button-quiet" type="button">Import JSON</button>
          <button id="export-button" class="button button-primary" type="button">Export JSON</button>
        </div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <main id="content" class="content" tabindex="-1"><p class="loading">Opening local architecture data…</p></main>
    </div>
  </div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">JavaScript is required. Open this file in a modern browser with IndexedDB enabled.</p></noscript>
  <script defer src="model.js"></script>
  <script defer src="demo.js"></script>
  <script defer src="storage.js"></script>
  <script defer src="topology.js"></script>
  <script defer src="views.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
